<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>通信テスト</title>
<style>
  body { font-family:-apple-system,sans-serif; padding:20px; background:#f5f7fa; }
  button { width:100%; padding:16px; font-size:16px; font-weight:bold; background:#2563eb; color:white; border:0; border-radius:10px; margin-top:14px; }
  pre { margin-top:16px; padding:12px; background:#111827; color:#a7f3d0; font-size:12px; white-space:pre-wrap; word-break:break-all; border-radius:8px; }
</style>
</head>
<body>

<h2>GASとの通信テスト（JSONP方式・LINE不要）</h2>
<p>このページ単体で、GASサーバーへの通信ができるかだけを確認します。</p>

<button onclick="runTest()">テスト実行</button>

<pre id="log">まだ実行していません。</pre>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwmx321DKDnWy6ZA5gdSfXHyIOfNbfOQ2pwy2UjDcwvjm2xexPQyrLvWCw2PuGryRMoKQ/exec";

function log(text) {
  document.getElementById("log").textContent += "\n" + text;
}

function runTest() {
  document.getElementById("log").textContent = "開始...";
  log("URL: " + API_URL);

  const callbackName = "jsonp_test_cb";

  const timeoutId = setTimeout(function() {
    log("タイムアウト（15秒応答なし）");
    cleanup();
  }, 15000);

  function cleanup() {
    clearTimeout(timeoutId);
    delete window[callbackName];
    if (script.parentNode) script.parentNode.removeChild(script);
  }

  window[callbackName] = function(data) {
    log("成功！応答: " + JSON.stringify(data));
    cleanup();
  };

  const url = API_URL + "?action=getParentHome&payload=" +
    encodeURIComponent(JSON.stringify({ token: "test" })) +
    "&callback=" + callbackName;

  log("script読み込み開始...");

  const script = document.createElement("script");
  script.src = url;
  script.onerror = function() {
    log("script読み込み失敗（onerror発火）");
    cleanup();
  };
  document.body.appendChild(script);
}
</script>

</body>
</html>
